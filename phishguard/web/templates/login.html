<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · PhishGuard</title>
<style>
  :root{--bg:#0a0e16;--surface:#141b2b;--surface2:#1a2233;--border:#222c40;--border2:#2c3852;
    --text:#e7edf6;--muted:#90a0b8;--accent:#3b82f6;--accent2:#06b6d4;
    --accent-grad:linear-gradient(135deg,#3b82f6,#06b6d4);--radius:14px;--radius-sm:9px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);color:var(--text);
    background:radial-gradient(800px 400px at 50% -10%,rgba(59,130,246,.14),transparent),var(--bg);
    min-height:100vh;display:grid;place-items:center;padding:24px}
  .login-card{width:380px;max-width:100%;background:linear-gradient(180deg,var(--surface),var(--surface2));
    border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 20px 50px rgba(0,0,0,.45);padding:30px}
  .brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:22px}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--accent-grad);display:grid;place-items:center;font-weight:800;color:#fff;box-shadow:0 6px 16px rgba(59,130,246,.4)}
  .brand .name{font-weight:700;font-size:18px} .brand .sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 6px}
  input{width:100%;background:#0e1320;border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:11px 13px;font-size:14px;font-family:inherit}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
  .btn{width:100%;margin-top:20px;background:var(--accent-grad);border:none;color:#fff;padding:11px;border-radius:var(--radius-sm);font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 6px 16px rgba(59,130,246,.3)}
  .alert{padding:10px 13px;border-radius:var(--radius-sm);margin-bottom:14px;font-size:13px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f3b4b4}
  .foot{text-align:center;margin-top:18px;font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
  <form class="login-card" method="post">
    <div class="brand"><div class="logo">P</div><div><div class="name">PhishGuard</div><div class="sub">Detection Engine</div></div></div>
    {% with messages = get_flashed_messages() %}{% if messages %}<div class="alert">{{ messages[0] }}</div>{% endif %}{% endwith %}
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" placeholder="admin" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
    <button class="btn" type="submit">Sign in</button>
    <div class="foot">Offline-first · your credentials never leave this machine</div>
  </form>
</body>
</html>
