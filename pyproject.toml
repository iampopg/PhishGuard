[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "1.0.0"
description = "Industrial-grade email phishing detection and analysis engine with CLI and web dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WRANCORP" }]
keywords = ["phishing", "email-security", "antiphishing", "threat-detection", "dfir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "dnspython>=2.4",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "flask>=3.0",
    "flask-login>=0.6",
    "werkzeug>=3.0",
]

[project.optional-dependencies]
virustotal = ["dkimpy>=1.1"]
clamav = ["pyclamd>=0.4"]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "mypy>=1.8", "ruff>=0.3", "black>=24.0"]

[project.scripts]
phishguard = "phishguard.cli:main"

[tool.setuptools.packages.find]
include = ["phishguard*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
