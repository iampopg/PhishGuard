<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="barSafe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="barSusp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="barPhish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="barMal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="880" height="400" rx="12" fill="url(#bg)"/>
  
  <!-- Header -->
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">PhishGuard Dashboard</text>
  <text x="32" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Real-time phishing detection analytics</text>
  
  <!-- Stat Cards -->
  <!-- Total -->
  <rect x="32" y="80" width="190" height="72" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="48" y="105" font-family="system-ui" font-size="11" fill="#94a3b8">Total Analyzed</text>
  <text x="48" y="135" font-family="system-ui" font-size="26" font-weight="700" fill="#f8fafc">1,809</text>
  
  <!-- Phishing -->
  <rect x="238" y="80" width="190" height="72" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1" stroke-opacity="0.4"/>
  <text x="254" y="105" font-family="system-ui" font-size="11" fill="#94a3b8">Phishing</text>
  <text x="254" y="135" font-family="system-ui" font-size="26" font-weight="700" fill="#ef4444">326</text>
  
  <!-- Malicious -->
  <rect x="444" y="80" width="190" height="72" rx="8" fill="#1e293b" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.4"/>
  <text x="460" y="105" font-family="system-ui" font-size="11" fill="#94a3b8">Malicious</text>
  <text x="460" y="135" font-family="system-ui" font-size="26" font-weight="700" fill="#a78bfa">163</text>
  
  <!-- Safe -->
  <rect x="650" y="80" width="198" height="72" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
  <text x="666" y="105" font-family="system-ui" font-size="11" fill="#94a3b8">Safe</text>
  <text x="666" y="135" font-family="system-ui" font-size="26" font-weight="700" fill="#22c55e">812</text>
  
  <!-- Bar Chart -->
  <text x="32" y="185" font-family="system-ui" font-size="13" font-weight="600" fill="#e2e8f0">Verdict Distribution</text>
  
  <!-- Safe bar -->
  <text x="32" y="215" font-family="system-ui" font-size="11" fill="#94a3b8">Safe</text>
  <rect x="80" y="202" width="520" height="20" rx="4" fill="url(#barSafe)"/>
  <text x="610" y="218" font-family="system-ui" font-size="11" font-weight="600" fill="#22c55e">812</text>
  
  <!-- Suspicious bar -->
  <text x="32" y="250" font-family="system-ui" font-size="11" fill="#94a3b8">Suspicious</text>
  <rect x="80" y="237" width="340" height="20" rx="4" fill="url(#barSusp)"/>
  <text x="430" y="253" font-family="system-ui" font-size="11" font-weight="600" fill="#f59e0b">508</text>
  
  <!-- Phishing bar -->
  <text x="32" y="285" font-family="system-ui" font-size="11" fill="#94a3b8">Phishing</text>
  <rect x="80" y="272" width="200" height="20" rx="4" fill="url(#barPhish)"/>
  <text x="290" y="288" font-family="system-ui" font-size="11" font-weight="600" fill="#ef4444">326</text>
  
  <!-- Malicious bar -->
  <text x="32" y="320" font-family="system-ui" font-size="11" fill="#94a3b8">Malicious</text>
  <rect x="80" y="307" width="100" height="20" rx="4" fill="url(#barMal)"/>
  <text x="190" y="323" font-family="system-ui" font-size="11" font-weight="600" fill="#a78bfa">163</text>
  
  <!-- Donut chart (simplified as circles) -->
  <text x="720" y="185" font-family="system-ui" font-size="13" font-weight="600" fill="#e2e8f0">Risk Split</text>
  
  <!-- Donut background -->
  <circle cx="770" cy="260" r="55" fill="none" stroke="#334155" stroke-width="18"/>
  <!-- Safe segment ~45% -->
  <circle cx="770" cy="260" r="55" fill="none" stroke="#22c55e" stroke-width="18" stroke-dasharray="155 303" stroke-dashoffset="0" transform="rotate(-90 770 260)"/>
  <!-- Suspicious segment ~28% -->
  <circle cx="770" cy="260" r="55" fill="none" stroke="#f59e0b" stroke-width="18" stroke-dasharray="97 303" stroke-dashoffset="-155" transform="rotate(-90 770 260)"/>
  <!-- Phishing segment ~18% -->
  <circle cx="770" cy="260" r="55" fill="none" stroke="#ef4444" stroke-width="18" stroke-dasharray="55 303" stroke-dashoffset="-252" transform="rotate(-90 770 260)"/>
  <!-- Malicious segment ~10% -->
  <circle cx="770" cy="260" r="55" fill="none" stroke="#7c3aed" stroke-width="18" stroke-dasharray="30 303" stroke-dashoffset="-307" transform="rotate(-90 770 260)"/>
  
  <!-- Center text -->
  <text x="770" y="256" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="700" fill="#f8fafc">1,809</text>
  <text x="770" y="274" text-anchor="middle" font-family="system-ui" font-size="10" fill="#64748b">reports</text>
  
  <!-- Legend -->
  <rect x="720" y="328" width="10" height="10" rx="2" fill="#22c55e"/>
  <text x="736" y="337" font-family="system-ui" font-size="10" fill="#94a3b8">Safe 45%</text>
  <rect x="775" y="328" width="10" height="10" rx="2" fill="#f59e0b"/>
  <text x="791" y="337" font-family="system-ui" font-size="10" fill="#94a3b8">Suspicious 28%</text>
  <rect x="720" y="348" width="10" height="10" rx="2" fill="#ef4444"/>
  <text x="736" y="357" font-family="system-ui" font-size="10" fill="#94a3b8">Phishing 18%</text>
  <rect x="775" y="348" width="10" height="10" rx="2" fill="#7c3aed"/>
  <text x="791" y="357" font-family="system-ui" font-size="10" fill="#94a3b8">Malicious 9%</text>
  
  <!-- Footer -->
  <text x="32" y="380" font-family="system-ui" font-size="10" fill="#475569">Offline-first · data stays local · v1.0 community build</text>
  <text x="720" y="380" font-family="system-ui" font-size="10" fill="#475569">Coded by @iampopg</text>
</svg>
